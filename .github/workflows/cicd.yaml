name: Car Game CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"
      - "templates/**"
      - "k8s/**"
      - ".github/workflows/cicd.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"
      - "templates/**"
      - "k8s/**"
      - ".github/workflows/cicd.yaml"

permissions:
  contents: read

jobs:

  # CI - runs for Pull Requests and pushes to master
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t car-game .

  # CD - runs only after changes reach master
  deploy:
    name: Deploy to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::428232898803:role/GitHubActions-CarGame-ECR
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t car-game .

      - name: Tag Docker image
        run: |
          docker tag car-game:latest 428232898803.dkr.ecr.eu-north-1.amazonaws.com/car-game:${GITHUB_SHA}
          docker tag car-game:latest 428232898803.dkr.ecr.eu-north-1.amazonaws.com/car-game:latest

      - name: Push Docker images to ECR
        run: |
          docker push 428232898803.dkr.ecr.eu-north-1.amazonaws.com/car-game:${GITHUB_SHA}
          docker push 428232898803.dkr.ecr.eu-north-1.amazonaws.com/car-game:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-north-1 \
            --name car-game-cluster

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

          kubectl set image deployment/car-game \
            car-game=428232898803.dkr.ecr.eu-north-1.amazonaws.com/car-game:${GITHUB_SHA}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/car-game --timeout=120s