apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: car-game-deployer
  namespace: default
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: car-game-deployer
  namespace: default
subjects:
  - kind: Group
    name: car-game-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: car-game-deployer
  apiGroup: rbac.authorization.k8s.io
