<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Dodge Game</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: Arial, sans-serif;
    color: white;
    padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 5vw, 32px);
    text-align: center;
  }

  #info {
    margin: 0;
    font-size: clamp(13px, 3.5vw, 18px);
    text-align: center;
  }

  #gameArea {
    position: relative;
    flex: 0 1 auto;
    width: min(400px, calc(100vw - 24px), max(0px, calc(66.6667vh - 126.6667px)));
    aspect-ratio: 2 / 3;
    border: 4px solid #444;
    background: #2e8b2e;
  }

  @supports (height: 100dvh) {
    #gameArea {
      width: min(400px, calc(100vw - 24px), max(0px, calc(66.6667dvh - 126.6667px)));
    }
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #2e8b2e;
    display: block;
  }

  #controls {
    display: flex;
    gap: 16px;
    width: min(100%, 320px);
  }

  #controls button {
    flex: 1;
    min-height: 56px;
    border: 2px solid #777;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 28px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #controls button:active {
    background: #555;
  }

  #controls button:focus-visible,
  #gameOverScreen button:focus-visible {
    outline: 3px solid #8cf;
    outline-offset: 2px;
  }

  #gameOverScreen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    width: min(90%, 320px);
    background: rgba(0,0,0,0.85);
    padding: clamp(12px, 4vw, 24px);
    border-radius: 10px;
    text-align: center;
    display: none;
  }

  #gameOverScreen h2,
  #gameOverScreen p {
    margin: 0 0 12px;
  }

  #gameOverScreen button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Car Dodge Game</h1>
<div id="info">Score: <span id="score">0</span> &nbsp;|&nbsp; Arrow keys or touch controls</div>

<div id="gameArea">
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div id="gameOverScreen">
    <h2>Game Over</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button onclick="resetGame()">Restart</button>
  </div>
</div>

<div id="controls" aria-label="Touch controls">
  <button type="button" data-direction="left" aria-label="Move left">←</button>
  <button type="button" data-direction="right" aria-label="Move right">→</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;

// Road settings
const ROAD_WIDTH = 300;
const ROAD_LEFT = (SCREEN_WIDTH - ROAD_WIDTH) / 2;
const ROAD_RIGHT = ROAD_LEFT + ROAD_WIDTH;

// Player car
const CAR_WIDTH = 50;
const CAR_HEIGHT = 90;
let playerX = SCREEN_WIDTH / 2 - CAR_WIDTH / 2;
const playerY = SCREEN_HEIGHT - CAR_HEIGHT - 20;
const playerSpeed = 6;

// Enemy car
const enemyWidth = 50;
const enemyHeight = 90;
let enemyX = randomEnemyX();
let enemyY = -enemyHeight;
let enemySpeed = 5;

let score = 0;
let gameActive = true;
let dashOffset = 0;

// Track which keys are currently pressed
const keys = {};
function clearControls() {
  keys.ArrowLeft = false;
  keys.ArrowRight = false;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    keys[e.key] = true;
  }
});
document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    keys[e.key] = false;
  }
});
window.addEventListener("blur", clearControls);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearControls();
});

document.querySelectorAll("#controls button").forEach((button) => {
  const direction = button.dataset.direction === "left" ? "ArrowLeft" : "ArrowRight";
  const release = () => { keys[direction] = false; };

  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    keys[direction] = true;
    button.setPointerCapture(e.pointerId);
  });
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
});

function randomEnemyX() {
  return ROAD_LEFT + Math.random() * (ROAD_WIDTH - enemyWidth);
}

function drawRoad() {
  ctx.fillStyle = "#2e8b2e";
  ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

  ctx.fillStyle = "#666";
  ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, SCREEN_HEIGHT);

  // Dashed center line (scrolls to feel like motion)
  ctx.fillStyle = "white";
  const dashHeight = 30;
  const gap = 20;
  for (let y = -dashHeight; y < SCREEN_HEIGHT; y += dashHeight + gap) {
    ctx.fillRect(SCREEN_WIDTH / 2 - 5, y + dashOffset, 10, dashHeight);
  }
}

function drawCar(x, y, color) {
  ctx.fillStyle = color;
  roundRect(x, y, CAR_WIDTH, CAR_HEIGHT, 8);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.fillRect(x + 8, y + 10, CAR_WIDTH - 16, 20);
  ctx.fillRect(x + 8, y + CAR_HEIGHT - 30, CAR_WIDTH - 16, 20);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function rectsCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function update() {
  if (!gameActive) return;

  // Player movement
  if (keys["ArrowLeft"] && playerX > ROAD_LEFT) {
    playerX -= playerSpeed;
  }
  if (keys["ArrowRight"] && playerX < ROAD_RIGHT - CAR_WIDTH) {
    playerX += playerSpeed;
  }

  // Enemy movement
  enemyY += enemySpeed;
  dashOffset = (dashOffset + enemySpeed) % 50;

  if (enemyY > SCREEN_HEIGHT) {
    enemyY = -enemyHeight;
    enemyX = randomEnemyX();
    score += 1;
    enemySpeed += 0.3;
    document.getElementById("score").textContent = score;
  }

  // Collision check
  if (rectsCollide(playerX, playerY, CAR_WIDTH, CAR_HEIGHT, enemyX, enemyY, enemyWidth, enemyHeight)) {
    gameActive = false;
    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOverScreen").style.display = "block";
  }
}

function draw() {
  drawRoad();
  drawCar(playerX, playerY, "#1e3fd6");
  drawCar(enemyX, enemyY, "#d61e1e");
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function resetGame() {
  clearControls();
  playerX = SCREEN_WIDTH / 2 - CAR_WIDTH / 2;
  enemyX = randomEnemyX();
  enemyY = -enemyHeight;
  enemySpeed = 5;
  score = 0;
  document.getElementById("score").textContent = score;
  document.getElementById("gameOverScreen").style.display = "none";
  gameActive = true;
}

gameLoop();
</script>

</body>
</html>
